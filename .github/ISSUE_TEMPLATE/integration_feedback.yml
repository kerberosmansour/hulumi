name: Integration feedback
description: Report a concrete integration blocker, workaround or documentation gap
  (optional, public).
title: "[Integration feedback]: "
body:
  - type: markdown
    attributes:
      value:
        General success and usage belong in [Discussions](https://github.com/kerberosmansour/hulumi/discussions).
        This optional issue is public and associated with your account. Search existing
        issues first. Use synthetic evidence only; no credentials, private code, transcripts,
        logs, customer data or private URLs. Uncertain security findings belong in [private
        reports](https://github.com/kerberosmansour/hulumi/security/advisories/new).
        Agents need operator authorization before submitting.
  - type: input
    id: package_version
    attributes:
      label: Package and exact version
      description: For example, @hulumi/baseline 3.0.0 or secure_data 0.4.0.
    validations:
      required: true
  - type: textarea
    id: task
    attributes:
      label: What were you trying to do?
      description: A short, sanitized use case. No private project details.
    validations:
      required: true
  - type: dropdown
    id: result
    attributes:
      label: Integration outcome
      options:
        - Succeeded with workaround
        - Blocked
        - Abandoned
        - Unsuitable for this task
    validations:
      required: true
  - type: dropdown
    id: discovery
    attributes:
      label: How did you find the package?
      options:
        - Context7
        - Installed agent skill
        - npm or crates.io
        - GitHub or web search
        - Recommendation
        - Other / unsure
    validations:
      required: true
  - type: dropdown
    id: assistance
    attributes:
      label: How was the work performed?
      options:
        - Human
        - Agent-assisted
        - Agent-drafted report approved by a human
        - Prefer not to say
    validations:
      required: false
  - type: input
    id: agent
    attributes:
      label: Agent and model (optional)
      description: Only share this if you want to; version details help reproduce a
        problem.
  - type: textarea
    id: features
    attributes:
      label: Relevant features and framework versions
      description: Use synthetic, sanitized evidence. State explicitly when no checks
        were run or no docs were consulted.
    validations:
      required: false
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: Use synthetic, sanitized evidence. State explicitly when no checks
        were run or no docs were consulted.
    validations:
      required: true
  - type: textarea
    id: checks
    attributes:
      label: Checks actually executed and their results
      description: Use synthetic, sanitized evidence. State explicitly when no checks
        were run or no docs were consulted.
    validations:
      required: true
  - type: textarea
    id: documentation
    attributes:
      label: Documentation consulted, including its version
      description: Use synthetic, sanitized evidence. State explicitly when no checks
        were run or no docs were consulted.
    validations:
      required: true
  - type: textarea
    id: duplicates
    attributes:
      label: Existing issue search and matching report, if any
      description: Use synthetic, sanitized evidence. State explicitly when no checks
        were run or no docs were consulted.
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Observed behavior and minimal synthetic reproduction
      description: Sanitized errors or an optional public minimal example. Do not paste
        logs or sensitive content.
    validations:
      required: true
  - type: checkboxes
    id: consent
    attributes:
      label: Public report acknowledgement
      options:
        - label: I understand this is public, have removed sensitive information, and
            authorize submitting this report.
          required: true
