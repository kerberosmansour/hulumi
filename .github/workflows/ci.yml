name: ci
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test + typecheck + lint
    timeout-minutes: 25
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 9.12.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint:exact-pin-guard
      - run: pnpm -r build
      - run: pnpm -r typecheck
      - run: pnpm -r --workspace-concurrency=1 test
      - run: pnpm -r lint
      - run: pnpm run lint:license-boundary
      - run: pnpm run lint:workflow-governance
      - run: python3 scripts/check-maintenance-workflows.py
      - run: pnpm --filter @hulumi/k8s-baseline run test:integration:kind
      - run: pnpm --filter @hulumi/k8s-baseline run test:integration:eks
      - run: pnpm run format:check

  baseline-test:
    name: "@hulumi/baseline unit tests (mocks only)"
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: echo "Covered by the successful workspace build, typecheck and test suite."

  policies-test:
    name: "@hulumi/policies unit tests"
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: echo "Covered by the successful workspace build, typecheck and test suite."

  examples-typecheck:
    name: "examples/* typecheck (mocks only)"
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: echo "Covered by the successful workspace build, typecheck and test suite."

  k8s-baseline-test:
    name: "@hulumi/k8s-baseline unit + release-readiness BDD"
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: echo "Covered by the successful workspace build, typecheck and test suite."

  account-foundation-mocks:
    name: "@hulumi/baseline AccountFoundation mocks"
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: echo "Covered by the successful workspace build, typecheck and test suite."

  cis-v5-pack-tests:
    name: "@hulumi/policies CisV5Pack tests"
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: echo "Covered by the successful workspace build, typecheck and test suite."

  drift-mocks:
    name: "@hulumi/drift mocks (verdict matrix + 6 security BDDs + TLA+ alignment)"
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: echo "Covered by the successful workspace build, typecheck and test suite."

  pulumi-cooling-off:
    name: pulumi cooling-off (72h minor/major / 24h patch)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Diff lockfile + check cooling-off
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git show "$BASE_SHA:pnpm-lock.yaml" > /tmp/base-lock.yaml || echo "" > /tmp/base-lock.yaml
          node scripts/cooling-off-diff.mjs /tmp/base-lock.yaml pnpm-lock.yaml

  release-artifacts-dry-run:
    name: release artifact dry-run (PR, no OIDC)
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 9.12.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - name: Build tarballs (dry-run, no publish)
        run: |
          mkdir -p .release-artifacts
          ABS_DEST="$(pwd)/.release-artifacts"
          for pkg in baseline policies drift k8s-baseline cloudflare-baseline platform-patterns; do
            (cd "packages/$pkg" && pnpm pack --pack-destination "$ABS_DEST")
          done
          ls -la .release-artifacts/
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ci-release-tarballs
          include-hidden-files: true
          if-no-files-found: error
          path: .release-artifacts/*.tgz
          retention-days: 2

  attestation-dry-run:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    name: SLSA attestation dry-run (pre-tag)
    needs: release-artifacts-dry-run
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ci-release-tarballs
          include-hidden-files: true
          if-no-files-found: error
          path: .release-artifacts
      - name: Attest provenance (main only)
        if: github.event_name == 'push'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ".release-artifacts/*.tgz"

  dco:
    name: DCO sign-off
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Check DCO sign-off on every commit in the PR
        if: github.event_name == 'pull_request'
        run: |
          BASE_SHA=${{ github.event.pull_request.base.sha }}
          HEAD_SHA=${{ github.event.pull_request.head.sha }}
          MISSING=$(git log --format='%H %s' "$BASE_SHA..$HEAD_SHA" | while read -r sha _; do
            git log -1 --format=%B "$sha" | grep -qE '^Signed-off-by: .+' || echo "$sha"
          done)
          if [ -n "$MISSING" ]; then
            echo "::error::The following commits lack a Signed-off-by trailer (DCO):"
            echo "$MISSING"
            exit 1
          fi
          echo "All commits carry DCO sign-off."
