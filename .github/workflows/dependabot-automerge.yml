name: dependabot-automerge
# Keep the status-check name for existing branch protection. All dependency and
# action updates require maintainer review; semver is not a security signal.
on: pull_request
permissions:
  contents: read
jobs:
  dependabot-automerge:
    name: dependabot-automerge
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require maintainer review
        run: echo "Dependency and GitHub Action updates require reviewed PRs and passing CI."
