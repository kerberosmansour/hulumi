name: dependency-review

on:
  pull_request:

permissions:
  contents: read

jobs:
  dependency-admission:
    name: Dependency admission
    uses: ./.github/workflows/osv-dependency-gate.yml
    permissions:
      contents: read

  dependency-review:
    needs: dependency-admission
    name: dependency-review
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tools/sca/package-lock.json

      - name: Install SCA brain
        run: npm ci --ignore-scripts --prefix tools/sca

      - name: Portable dependency review
        run: tools/sca/node_modules/.bin/tsx tools/sca/src/cli/dependency-review.ts
