name: dependency-review

on:
  pull_request:

permissions:
  contents: read

jobs:
  dependency-review:
    name: dependency-review
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: tools/sca/package-lock.json

      - name: Install SCA brain
        run: npm ci --prefix tools/sca

      - name: Portable dependency review
        run: tools/sca/node_modules/.bin/tsx tools/sca/src/cli/dependency-review.ts
