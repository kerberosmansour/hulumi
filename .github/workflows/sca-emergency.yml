name: sca-emergency
# One read-only daily OSV scan. Repairs require normal reviewed PRs.
on:
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sca-emergency
  cancel-in-progress: false
jobs:
  scan:
    name: sca-emergency
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/osv-dependency-gate.yml
    permissions:
      contents: read
