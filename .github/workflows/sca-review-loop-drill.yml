name: sca-review-loop-drill
# Offline fixture verification; no remote agent, installed vulnerable package or PR side effects.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sca-review-loop-drill
  cancel-in-progress: false
jobs:
  dependency-admission:
    name: Dependency admission
    uses: ./.github/workflows/osv-dependency-gate.yml
    permissions:
      contents: read

  review-loop-drill:
    needs: dependency-admission
    name: review-loop-drill
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Install scanner tooling without lifecycle scripts
        run: npm ci --ignore-scripts --prefix tools/sca
      - name: Detect, triage and verify a fixture-only dependency correction
        env:
          SCA_SCANNER_MODE: fixture
        run: |
          set -euo pipefail
          drill_dir="$(mktemp -d)"
          trap 'rm -rf "$drill_dir"' EXIT
          cd "$drill_dir"
          printf 'Django==1.2\n' > requirements.txt
          cat > osv-scanner.toml <<'EOF'
          [[sca_lockfile]]
          ecosystem = "PyPI"
          path = "requirements.txt"
          parser = "requirements.txt"
          package = "django"
          badVersion = "1.2"
          knownAdvisory = "PYSEC-2010-12"
          fixture = true
          EOF
          mkdir -p .cache/sca-state
          printf '%s\n' '{"version":1,"revision":0,"findings":{}}' > .cache/sca-state/findings.json
          "$GITHUB_WORKSPACE/tools/sca/node_modules/.bin/tsx" "$GITHUB_WORKSPACE/tools/sca/src/cli/scan.ts" scan --output before.json
          "$GITHUB_WORKSPACE/tools/sca/node_modules/.bin/tsx" "$GITHUB_WORKSPACE/tools/sca/src/cli/triage.ts" triage --findings before.json --state .cache/sca-state/findings.json --work-items work-items.json --events events.json
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          import assert from 'node:assert/strict';
          const before = JSON.parse(readFileSync('before.json'));
          const items = JSON.parse(readFileSync('work-items.json'));
          assert.equal(before.findings.length, 1);
          assert.ok(items.workItems.some(item => item.track === 'emergency' && item.state === 'in_progress'));
          assert.ok(items.evidence.some(item => item.osv.fixedVersion === '1.2.7'));
          NODE
          # This changes a text fixture only; it does not install this historical package.
          printf 'Django==1.2.7\n' > requirements.txt
          "$GITHUB_WORKSPACE/tools/sca/node_modules/.bin/tsx" "$GITHUB_WORKSPACE/tools/sca/src/cli/scan.ts" scan --output after.json
          "$GITHUB_WORKSPACE/tools/sca/node_modules/.bin/tsx" "$GITHUB_WORKSPACE/tools/sca/src/cli/scan.ts" verify-fixtures-not-installed
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          import assert from 'node:assert/strict';
          assert.equal(JSON.parse(readFileSync('after.json')).findings.length, 0);
          console.log('Offline scan/triage/correction drill passed. Maintainer review remains required for real updates.');
          NODE
