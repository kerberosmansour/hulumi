# Reusable release signing lane.
#
# Called by release.yml after the build job has produced tarballs, SBOMs,
# and tarballs-sha256.txt without `id-token: write`. This workflow owns the
# OIDC-backed signing/publish step so user-controlled build commands do not
# share a runner with the provenance-signing permission.

name: sign-and-publish

on:
  workflow_call:
    inputs:
      artifact-name:
        required: true
        type: string
      package-list:
        required: true
        type: string

permissions:
  contents: read

jobs:
  sign-and-publish:
    name: attest tarballs, publish npm packages, create release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download prebuilt release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.artifact-name }}
          path: .release-artifacts

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Verify bundled npm CLI supports trusted publishing OIDC
        run: |
          node -e 'const v = require("node:child_process").execFileSync("npm", ["--version"], {encoding:"utf8"}).trim(); if (!/^[0-9]+\.[0-9]+\.[0-9]+$/.test(v)) throw new Error("Invalid bundled npm version"); const n = v.split(".").map(Number); if (n[0] < 11 || (n[0] === 11 && (n[1] < 5 || (n[1] === 5 && n[2] < 1)))) throw new Error("The trusted Node runtime must bundle npm >=11.5.1 for OIDC publishing");'
          node --version
          npm --version

      - name: Verify release artifact digest manifest
        env:
          PACKAGE_LIST: ${{ inputs.package-list }}
        run: |
          set -euo pipefail
          test -f .release-artifacts/tarballs-sha256.txt
          sha256sum --check .release-artifacts/tarballs-sha256.txt
          for pkg in $PACKAGE_LIST; do
            tarball="$(find .release-artifacts -maxdepth 1 -type f -name "hulumi-${pkg}-*.tgz" -print -quit)"
            test -n "$tarball"
            test -f ".release-artifacts/sbom-${pkg}.cdx.json"
          done

      - name: Attest provenance for tarballs
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: ".release-artifacts/*.tgz"

      - name: npm publish (sequential — verify partial publication before retry)
        env:
          PACKAGE_LIST: ${{ inputs.package-list }}
        run: |
          set -euo pipefail
          for pkg in $PACKAGE_LIST; do
            tarball="$(find .release-artifacts -maxdepth 1 -type f -name "hulumi-${pkg}-*.tgz" -print -quit)"
            test -n "$tarball"
            npm publish "$tarball" --provenance --access public
          done

      - name: Create GitHub release with SBOMs + tarballs
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3
        with:
          files: |
            .release-artifacts/*.tgz
            .release-artifacts/sbom-*.cdx.json
          generate_release_notes: true
          fail_on_unmatched_files: true
