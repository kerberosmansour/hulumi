\* Hardened configuration — this is the one that must PASS.
\*
\* NaiveMode = FALSE removes both weak transitions: there is no
\* AttemptAssume rule at all, and serving is enabled only by the complete
\* validated aggregate. The invariants below are therefore claims about the
\* structure, not about operator discipline.
\*
\* Run the naive counterexample with HulumiAuroraIdentityBoundaryNaive.cfg.

SPECIFICATION Spec

CONSTANTS
    Runtime  = Runtime
    Migrator = Migrator
    Broker   = Broker
    Deployer = Deployer
    NaiveMode = FALSE

INVARIANTS
    TypeOK
    RuntimeNeverHoldsCredential
    IdentitiesNonInterchangeable
    NoServingBeforeValidated

\* Deadlock checking is DISABLED deliberately, and the reason matters.
\* This is a SAFETY-only model with a natural terminal state: once both
\* privileged identities hold their bounded credential, all validations are
\* recorded and serving has started, no action is enabled. TLC reports that
\* terminal state as "Deadlock reached". That is the model finishing, not a
\* defect — and a stuttering action added purely to silence it would hide
\* real deadlocks in any future revision. Liveness is explicitly NOT claimed
\* here (see the fairness note in the .tla header), so deadlock detection is
\* checking a property this spec does not assert.
CHECK_DEADLOCK FALSE
