\* NAIVE configuration — this one MUST FAIL, and failing is its purpose.
\*
\* A spec that only ever passes proves nothing about the model's power to
\* discriminate. NaiveMode = TRUE enables the two designs the critique
\* rejected:
\*   1. AttemptAssume, i.e. role assumption reachable by any identity, which
\*      should violate IdentitiesNonInterchangeable and, transitively,
\*      RuntimeNeverHoldsCredential.
\*   2. StartServingNaive, i.e. serving constructed from individual outputs
\*      with the validation flag read only by convention, which should
\*      violate NoServingBeforeValidated.
\*
\* Expected: TLC reports an invariant violation with a counterexample trace.
\* If this configuration PASSES, the model is not discriminating and the
\* hardened PASS is worthless — treat that as a spec defect, not a success.

SPECIFICATION Spec

CONSTANTS
    Runtime  = Runtime
    Migrator = Migrator
    Broker   = Broker
    Deployer = Deployer
    NaiveMode = TRUE

INVARIANTS
    TypeOK
    RuntimeNeverHoldsCredential
    IdentitiesNonInterchangeable
    NoServingBeforeValidated

\* Deadlock checking is DISABLED deliberately, and the reason matters.
\* This is a SAFETY-only model with a natural terminal state: once both
\* privileged identities hold their bounded credential, all validations are
\* recorded and serving has started, no action is enabled. TLC reports that
\* terminal state as "Deadlock reached". That is the model finishing, not a
\* defect — and a stuttering action added purely to silence it would hide
\* real deadlocks in any future revision. Liveness is explicitly NOT claimed
\* here (see the fairness note in the .tla header), so deadlock detection is
\* checking a property this spec does not assert.
CHECK_DEADLOCK FALSE
